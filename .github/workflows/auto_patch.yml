name: Auto-Patch RAG Assistant

on:
  schedule:
    - cron: '0 2 * * *' # Tous les soirs à 2h00
  workflow_dispatch: # Lancement manuel possible

permissions:
  contents: write

jobs:
  run-patcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: pip install requests google-generativeai

      - name: Exécution du script d'analyse multi-RAG intelligent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_patch_rag.py

      - name: Commit et Push automatique si un fichier a changé
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Auto-Patch Multi-RAG] Correction intelligente des angles morts et échecs SAV"
          file_pattern: "ipack.txt data/examens/regles_dnb_eps.txt data/examens/memoire_examens_santorin.txt"

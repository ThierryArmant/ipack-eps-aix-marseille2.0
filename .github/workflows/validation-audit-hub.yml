name: Validation audit HUB
on:
  push:
    branches:
      - audit/retest-113-20261018
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests unitaires du dépôt
        run: python3 -m unittest discover -s tests -q

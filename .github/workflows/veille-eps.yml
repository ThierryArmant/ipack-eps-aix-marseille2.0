name: Veille documentaire EPS — contrôle hebdomadaire
on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veille-eps
  cancel-in-progress: false
env:
  REPORT_BRANCH: veille/controle-hebdomadaire
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Tests de la veille
        run: python -m unittest tests/test_veille_sources.py -v
      - name: Reprendre le dernier état de veille
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$REPORT_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$REPORT_BRANCH"
            git worktree add --detach "$RUNNER_TEMP/veille-rapports" FETCH_HEAD
            if test -f "$RUNNER_TEMP/veille-rapports/docs/veille/surveillance.json"; then
              cp "$RUNNER_TEMP/veille-rapports/docs/veille/surveillance.json" docs/veille/surveillance.json
            fi
          else
            status=$?
            if test "$status" -ne 2; then
              exit "$status"
            fi
            git worktree add --detach "$RUNNER_TEMP/veille-rapports" HEAD
          fi
      - name: Contrôler les sources publiques
        id: collecte
        continue-on-error: true
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python veille_sources.py
      - name: Archiver le rapport même en cas d’échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-veille-eps
          path: |
            docs/veille/controle-*.md
            docs/veille/surveillance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Conserver les rapports sur la branche de veille
        if: always() && (steps.collecte.outcome == 'success' || steps.collecte.outcome == 'failure')
        run: |
          report_dir="$RUNNER_TEMP/veille-rapports"
          mkdir -p "$report_dir/docs/veille"
          cp docs/veille/surveillance.json docs/veille/controle-*.md "$report_dir/docs/veille/"
          git -C "$report_dir" add -- docs/veille
          if ! git -C "$report_dir" diff --cached --quiet; then
            git -C "$report_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Veille EPS : archiver le relevé des sources'
            git -C "$report_dir" push origin "HEAD:refs/heads/$REPORT_BRANCH"
          fi
          echo "[Historique des rapports](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/$REPORT_BRANCH/docs/veille)" >> "$GITHUB_STEP_SUMMARY"
      - name: Signaler une collecte entièrement indisponible
        if: steps.collecte.outcome == 'failure'
        run: |
          echo "::error::Aucune source exploitable. Consultez le rapport archivé et vérifiez les sources."
          exit 1
